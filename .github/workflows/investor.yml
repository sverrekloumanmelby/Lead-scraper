name: Investeringsassistent

# Tre timeplaner med økende dybde. Cron kjører i UTC; tidene under er valgt
# slik at e-posten ligger klar tidlig norsk morgen (UTC+1 vinter, UTC+2 sommer).
on:
  schedule:
    - cron: "30 5 * * 1-5"    # hverdager ~07:30 norsk tid — kort dagsoppdatering
    - cron: "0 6 * * 1"       # mandager ~08:00 — ukesrapport med kandidater
    - cron: "0 7 1 * *"       # den 1. i måneden ~09:00 — månedsrapport
  workflow_dispatch:
    inputs:
      mode:
        description: "Hvilken rapport som skal kjøres"
        required: true
        default: daily
        type: choice
        options: [daily, weekly, monthly]
      dry_run:
        description: "Bygg rapporten uten å sende e-post"
        required: false
        default: false
        type: boolean

# Hindrer at to kjøringer skriver til state-filen samtidig.
concurrency:
  group: investor-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rapport:
    runs-on: ubuntu-latest
    permissions:
      contents: write        # trengs for å committe oppdatert historikk

    steps:
      - name: Hent kode
        uses: actions/checkout@v4

      - name: Sett opp Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: investor/requirements.txt

      - name: Installer avhengigheter
        run: pip install -r investor/requirements.txt

      - name: Finn ut hvilken rapport som skal kjøres
        id: modus
        env:
          # Hvilken cron som utløste kjøringen avgjør rapporttypen.
          SCHEDULE: ${{ github.event.schedule }}
          VALGT: ${{ inputs.mode }}
        run: |
          if [ -n "$VALGT" ]; then
            MODE="$VALGT"
          else
            case "$SCHEDULE" in
              "0 7 1 * *") MODE=monthly ;;
              "0 6 * * 1") MODE=weekly ;;
              *)           MODE=daily ;;
            esac
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "Kjører $MODE-rapport"

      - name: Kjør investeringsassistenten
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          MOTTAKER_EPOST: ${{ secrets.MOTTAKER_EPOST }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m investor.main --mode "${{ steps.modus.outputs.mode }}" --dry-run
          else
            python -m investor.main --mode "${{ steps.modus.outputs.mode }}"
          fi

      - name: Ta vare på rapporten som artefakt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rapport-${{ steps.modus.outputs.mode }}-${{ github.run_number }}
          path: investor/out/
          if-no-files-found: ignore
          retention-days: 14

      - name: Lagre oppdatert historikk
        if: success() && inputs.dry_run != true
        run: |
          if git diff --quiet -- investor/data/state.json; then
            echo "Ingen endring i historikken."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add investor/data/state.json
          git commit -m "Oppdater investeringshistorikk (${{ steps.modus.outputs.mode }}) [skip ci]"
          # Branchen kan ha fått nye commits mens jobben kjørte.
          for forsok in 1 2 3; do
            if git push; then exit 0; fi
            echo "Push feilet, henter og prøver igjen ($forsok/3)"
            git pull --rebase --autostash || true
            sleep $((forsok * 3))
          done
          echo "Klarte ikke pushe historikken." >&2
          exit 1
